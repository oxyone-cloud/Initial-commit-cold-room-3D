name: Build Jekyll Site with Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # Étape 1 : Build du site Jekyll via Docker (jekyll/builder)
      # ========================================================
      - name: Build Jekyll site using jekyll/builder
        run: |
          # Exécution du conteneur jekyll/builder avec les bons droits d'accès
          docker run --rm \
            --volume="$PWD:/srv/jekyll:Z" \
            -e JEKYLL_ENV=production \
            jekyll/builder:latest \
            jekyll build

      # ========================================================
      # Étape 2 : Empaquetage du site compilé (_site)
      # ========================================================
      - name: Package site artifact
        run: |
          mkdir -p dist
          # Compression du dossier _site généré par Jekyll
          tar -czvf dist/jekyll-site.tar.gz -C _site .

      # ========================================================
      # Étape 3 : Empreinte SHA-256 (Compatible SLSA / Provenance)
      # ========================================================
      - name: Generate SHA-256 hash for provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          # Empreinte cryptographique du package final
          echo "hashes=$(sha256sum jekyll-site.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

      # ========================================================
      # Étape 4 : Sauvegarde de l'artefact pour GitHub Actions
      # ========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site-package
          path: dist/jekyll-site.tar.gz
