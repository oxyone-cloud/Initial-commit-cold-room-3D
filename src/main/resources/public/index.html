<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRAIRIES 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* BASE ET STRUCTURE ACCESSIBLE */
        body { 
            margin: 0; 
            background: #030712; 
            color: #f9fafb; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            overflow: hidden; 
        }

        /* ÉCRAN D'ACCUEIL / SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #060b18;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .splash-title {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .splash-subtitle {
            font-size: 1.1em;
            color: #9ca3af;
            margin: 0 0 20px 0;
            font-weight: 500;
        }

        .badge-gratuit {
            background: #00f0ff;
            color: #030712;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.85em;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin-bottom: 25px;
        }

        /* BOUTON FLOCON DE NEIGE ANIMÉ */
        .snowflake-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .snowflake-icon {
            font-size: 70px;
            color: #00f0ff;
            animation: pulse 2s infinite ease-in-out, spin 20s infinite linear;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6));
        }

        .snowflake-txt {
            margin-top: 15px;
            color: #9ca3af;
            font-size: 0.95em;
            letter-spacing: 1px;
            font-weight: 600;
            animation: pulse-text 2s infinite ease-in-out;
        }

        /* CONTENEUR DES BADGES */
        .badges-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .codehype-splash-container, .github-splash-container, .ph-splash-container {
            display: flex;
            justify-content: center;
            opacity: 0.9;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .codehype-splash-container:hover, .github-splash-container:hover, .ph-splash-container:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        /* STYLE DES BADGES GITHUB ET PRODUCT HUNT */
        .github-badge-card, .ph-badge-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            height: 65px;
            box-sizing: border-box;
        }
        .github-badge-card {
            border: 1.5px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .github-badge-card:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            border-color: #00f0ff;
        }
        .ph-badge-card {
            border: 1.5px solid #DA552F;
            box-shadow: 0 0 15px rgba(218, 85, 47, 0.3);
        }
        .ph-badge-card:hover {
            box-shadow: 0 0 20px rgba(218, 85, 47, 0.6);
            border-color: #ff7651;
        }
        .badge-info-title {
            font-size: 0.7em;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            text-align: left;
        }
        .badge-info-user {
            font-size: 0.85em;
            font-weight: bold;
            text-align: left;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.9)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; color: #ffffff; }
        }

        /* PANNEAU DE CONTRÔLE GAUCHE */
        #gui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(3, 15, 30, 0.96); 
            padding: 20px; 
            border-left: 4px solid #00f0ff; 
            width: 320px; 
            z-index: 100; 
            border-radius: 0 10px 10px 0; 
            box-shadow: 0 0 25px rgba(0,0,0,0.7); 
            max-height: 95vh; 
            overflow-y: auto; 
        }
        
        /* HORLOGE */
        #clock-panel { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(3, 15, 30, 0.9); 
            padding: 10px 20px; 
            border-right: 4px solid #00f0ff; 
            z-index: 100; 
            border-radius: 10px 0 0 10px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            text-align: right;
        }
        #clock-time { font-size: 1.8em; font-weight: bold; color: #ffffff; font-family: monospace; letter-spacing: 2px; }
        #clock-date { font-size: 0.75em; text-transform: uppercase; color: #00e0ff; letter-spacing: 1px; margin-top: 2px; font-weight: 600; }

        /* CARTE CONTACT & LIENS OFFICIELS */
        .contact-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.85em;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            color: #e5e7eb;
        }
        .contact-icon {
            color: #00f0ff;
            font-size: 1.1em;
            width: 16px;
            text-align: center;
        }
        .contact-link {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 600;
        }
        .contact-link:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        /* BOUTON DÉMO VIDÉO (CYAN) */
        .demo-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #00f0ff, #0088cc);
            color: #030712;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(0, 240, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 240, 255, 0.6);
            color: #000000;
        }

        /* BOUTON WHATSAPP */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.5);
            color: #ffffff;
        }

        /* OPTIONS BOUTONS RONDS (RADIO) */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            color: #e5e7eb;
        }
        .radio-input {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            outline: none;
            background: transparent;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
        }
        .radio-input::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: #00f0ff;
        }
        .radio-input:checked::before {
            transform: scale(1);
        }

        /* BOÎTES D'AFFICHAGE */
        .display-box { background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 5px; margin-bottom: 12px; text-align: center; border: 1px solid #00f0ff; }
        .main-val { font-size: 1.6em; font-weight: bold; color: #ffffff; }
        .sub-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; font-weight: 600; }
        
        /* FORMULAIRES */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 0.85em; font-weight: 600; color: #e5e7eb; margin-bottom: 4px; }
        .val-badge { float: right; background: #00f0ff; color: #030712; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; }
        
        select { 
            width: 100%; 
            background: #0f172a; 
            color: #00f0ff; 
            border: 1.5px solid #00f0ff; 
            padding: 8px; 
            border-radius: 4px; 
            margin-top: 5px; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: 600;
        }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00f0ff; margin-top: 5px; }
        
        /* BOUTONS */
        button { background: #00f0ff; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 5px; color: #030712; transition: 0.3s; font-size: 0.85em; letter-spacing: 0.5px; }
        button:hover { background: #ffffff; box-shadow: 0 0 15px #00f0ff; }

        /* NAV PAD */
        #nav-pad { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 55px); grid-gap: 8px; z-index: 100; }
        .nav-btn { width: 55px; height: 55px; border: 2px solid #00f0ff; color: #00f0ff; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,240,255,0.1); font-weight: bold; border-radius: 8px; }
        
        /* ADMIN PANEL */
        .admin-panel { background: rgba(15, 10, 5, 0.98); border: 2px solid #ff9900; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .admin-title { color: #ff9900; font-size: 0.85em; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 5px; border-bottom: 1px solid rgba(255,153,0,0.2); padding-bottom: 5px; color: #f3f4f6; }

        /* BOUTON PHOTO & CAPTURE */
        .photo-btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: #ffffff;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            transition: 0.3s;
        }
        .photo-btn:hover {
            background: linear-gradient(135deg, #ffaa22, #ff6611);
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.6);
        }

        /* PREMIUM LINK STYLE */
        .premium-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 153, 0, 0.2));
            border: 1px solid #ff9900;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .premium-box:hover {
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 153, 0, 0.3));
        }
    </style>
</head>
<body>

    <!-- CONTENEUR DES BADGES -->
    <div class="badges-container">

        <div class="codehype-splash-container">
